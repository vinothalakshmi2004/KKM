# Render Blueprint for the KKM backend API (service "kkmlodge").
# Secrets are NOT stored here: values marked sync:false are entered in the Render dashboard.
services:
  - type: web
    name: kkmlodge
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: TZ
        value: Asia/Kolkata
      - key: PAYMENT_MODE
        value: dummy
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ONLINE_MAX_ACTIVE_PER_PHONE
        value: "3"
      - key: CLIENT_URL
        value: https://kkmlodge.netlify.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AADHAAR_ENC_KEY
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
